<!DOCTYPE html>
<html lang="id">
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Warung Bebakaran</title>

	<link rel="stylesheet" href="style.css">

	<link rel="stylesheet"
	  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>

	<!-- NAVBAR -->
	<nav class="navbar">
	  <div class="logo"></div>

	  <div class="menu">
		<i class="fa-solid fa-magnifying-glass"></i>
		<i class="fa-solid fa-bars"></i>
	  </div>
	</nav>

	<!-- SLIDER -->
	<section class="slider">

	  <!-- SLIDE 1 -->
	  <div class="slide active">

		<div class="left">
		  <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=1000" alt="">
		</div>

		<div class="center">
		  <span>#1 Most Loved Dish</span>

		  <h1>LOTEK <br><b>PERKEDEL</b></h1>

		  <div class="buttons">
			<button class="play">
			  <i class="fa-solid fa-play"></i> Play Video
			</button>

			<button class="order">
			  <i class="fa-solid fa-bag-shopping"></i> Order Food
			</button>
		  </div>

		  <!-- CARDS -->
		  <div class="food-list">

			<div class="food-card active-card">
			  <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=300">
			  <p>Salad</p>
			</div>

			<div class="food-card">
			  <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=300">
			  <p>Healthy</p>
			</div>

			<div class="food-card">
			  <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=300">
			  <p>Chicken</p>
			</div>

			<div class="food-card">
			  <img src="https://images.unsplash.com/photo-1525755662778-989d0524087e?q=80&w=300">
			  <p>Soup</p>
			</div>

		  </div>
		</div>

		<!-- RIGHT CARD -->
		<div class="right">

		  <div class="rating-box">
			<h2>4.9</h2>
			<h3>Chef Feny</h3>

			<p>
			  Makanan modern dengan cita rasa premium dan tampilan elegan.
			</p>

			<div class="likes">
			  <i class="fa-solid fa-thumbs-up"></i> 92 Likes
			</div>
		  </div>

		</div>

	  </div>

	</section>

	<!-- BOTTOM NAV -->
	<div class="bottom-nav">

	  <i class="fa-solid fa-utensils active"></i>
	  <i class="fa-solid fa-martini-glass"></i>
	  <i class="fa-regular fa-comment"></i>
	  <i class="fa-regular fa-user"></i>

	  <div class="mic">
		<i class="fa-solid fa-microphone"></i>
	  </div>

	</div>
	
	<button onclick="logout()">
	  Logout
	</button>

	<script src="script.js"></script>
  </body>
</html>
