<!DOCTYPE html>
<html>
  <head>

	<meta charset="UTF-8">
	<meta name="viewport"

	<link rel="stylesheet" href="auth.css">

	<title>Register</title>

  </head>

  <body>

	<div class="auth-box">

	  <h1>Register</h1>

	  </button>

	  <p>
		Sudah punya akun?
		<a href="login.html">
		  Login
		</a>
	  </p>

	</div>

	<script src="auth.js"></script>

  </body>
</html>
